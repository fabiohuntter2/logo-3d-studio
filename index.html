<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo 3D Studio</title>
<meta name="description" content="Crie logos 3D realistas, anime e exporte em PNG, vídeo, GIF e figurinha.">
<meta name="theme-color" content="#15171e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Logo 3D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { color-scheme: dark; --bg:#0b0c10; --panel:#15171e; --line:#262a35; --text:#e8eaf0; --dim:#8c93a6; --accent:#f5b921; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.4 "Segoe UI", system-ui, sans-serif; display: grid; grid-template: 48px 1fr 26px / 290px 1fr 290px; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0 14px 0 0; letter-spacing: .5px; }
  header h1 b { color: var(--accent); }
  aside { background: var(--panel); overflow-y: auto; padding: 10px; border-right: 1px solid var(--line); }
  aside.right { border-right: 0; border-left: 1px solid var(--line); }
  #stage { position: relative; display: flex; align-items: center; justify-content: center; padding: 16px; min-width: 0; min-height: 0;
    background: repeating-conic-gradient(#1a1c23 0 25%, #14161c 0 50%) 0 0 / 24px 24px; }
  #view { max-width: 100%; max-height: 100%; box-shadow: 0 0 0 1px var(--line), 0 12px 40px #0008; cursor: grab; }
  footer { grid-column: 1 / -1; padding: 4px 12px; color: var(--dim); background: var(--panel); border-top: 1px solid var(--line); }
  button { background: #232733; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; font: inherit; cursor: pointer; }
  button:hover { background: #2d3242; }
  button.primary { background: var(--accent); color: #17130a; border-color: var(--accent); font-weight: 600; }
  button.mini { padding: 1px 6px; border: 0; background: transparent; color: var(--dim); }
  section { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; }
  h3 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); }
  .row { display: grid; grid-template-columns: 108px 1fr 38px; align-items: center; gap: 6px; padding: 3px 0; }
  .row span { color: var(--dim); }
  .row output { text-align: right; font-variant-numeric: tabular-nums; color: var(--dim); }
  .row input[type=range] { width: 100%; accent-color: var(--accent); }
  .row input[type=file], .row select, .row textarea { grid-column: 2 / -1; width: 100%; background: #0f1116; color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 4px; font: inherit; }
  .row input[type=checkbox] { justify-self: start; accent-color: var(--accent); }
  .row input[type=color] { width: 44px; height: 24px; padding: 0; border: 1px solid var(--line); background: none; }
  .btns { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .layer { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
  .layer:hover { background: #1c1f29; }
  .layer.on { border-color: var(--accent); background: #221d0e; }
  .matimg { display: grid; grid-template-columns: 108px 44px 1fr; align-items: center; gap: 6px; padding: 4px 0; }
  .matimg span { color: var(--dim); }
  .matimg .thumb { width: 44px; height: 44px; border-radius: 6px; border: 1px dashed var(--line); background: #0f1116 center / cover; display: grid; place-items: center; color: var(--dim); font-size: 20px; cursor: pointer; }
  .matimg .thumb:hover { border-color: var(--accent); }
  .matimg .mini { justify-self: start; }
  .modal { position: fixed; inset: 0; background: #000a; display: grid; place-items: center; z-index: 50; padding: 16px; }
  .sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: min(920px, 100%); max-height: 90vh; overflow-y: auto; padding: 16px 20px; }
  .sheet-head { display: flex; align-items: center; gap: 16px; margin-bottom: 4px; }
  .sheet-head h2 { margin: 0; font-size: 18px; flex: 1; }
  .keep { display: flex; gap: 6px; align-items: center; color: var(--dim); }
  .sheet h3 { margin: 14px 0 8px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .card { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 8px; text-align: center; }
  .card:hover { border-color: var(--accent); }
  .card .ico { font-size: 30px; line-height: 1; }
  .bg-wrap { display: grid; place-items: center; padding: 10px; border-radius: 8px; margin: 8px 0;
    background: repeating-conic-gradient(#3a3d46 0 25%, #2a2c33 0 50%) 0 0 / 20px 20px; }
  .bg-preview { max-width: 100%; max-height: 55vh; cursor: crosshair; }
  .compose button { flex: 1; }
  #hud { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px;
    background: #15171ee6; border: 1px solid var(--line); border-radius: 10px; padding: 5px 8px; box-shadow: 0 6px 24px #0008;
    max-width: calc(100% - 24px); flex-wrap: wrap; justify-content: center; }
  #hud button { padding: 4px 10px; min-width: 32px; }
  #hud button:disabled { opacity: 0.35; cursor: default; }
  #hud .hud-name { color: var(--accent); font-weight: 600; padding: 0 6px; white-space: nowrap; }
  #hud .hud-label { color: var(--dim); padding: 0 2px 0 4px; }
  #hud .hud-sep { width: 1px; height: 20px; background: var(--line); margin: 0 6px; }
  .hint { color: var(--dim); margin: 6px 0 0; font-size: 12px; }
  #tabs { display: none; }

  /* ---------- celular e tela estreita ---------- */
  @media (max-width: 820px) {
    html, body { height: 100dvh; }
    body { grid-template: auto minmax(0, 48dvh) auto minmax(0, 1fr) auto / minmax(0, 1fr); font-size: 14px; }
    header { grid-column: 1; grid-row: 1; overflow-x: auto; padding: 6px 8px; gap: 6px; scrollbar-width: none; }
    header::-webkit-scrollbar { display: none; }
    header h1 { font-size: 13px; white-space: nowrap; margin-right: 2px; }
    header button { white-space: nowrap; flex: none; }
    #stage { grid-column: 1; grid-row: 2; padding: 6px; }
    #tabs { display: flex; grid-column: 1; grid-row: 3; background: var(--panel); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    #tabs button { flex: 1; border: 0; border-radius: 0; background: transparent; color: var(--dim); padding: 11px 4px; border-bottom: 3px solid transparent; font-weight: 600; }
    #tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
    aside, aside.right { grid-column: 1; grid-row: 4; border: 0; padding: 10px 10px 24px; }
    footer { grid-column: 1; grid-row: 5; font-size: 11px; padding: 4px 10px; }
    body[data-tab="layers"] aside.right, body[data-tab="props"] aside.right { display: none; }
    body[data-tab="scene"] aside.left { display: none; }
    body[data-tab="layers"] #props { display: none; }
    body[data-tab="props"] aside.left > section { display: none; }
    button { padding: 9px 12px; touch-action: manipulation; }
    button.mini { padding: 6px 10px; font-size: 15px; }
    .row { grid-template-columns: 116px minmax(0, 1fr) 42px; padding: 5px 0; }
    .row input[type=range] { height: 30px; }
    .row input[type=checkbox] { width: 22px; height: 22px; }
    .row input[type=color] { width: 52px; height: 30px; }
    .layer { padding: 10px 8px; }
    #hud { bottom: 4px; padding: 3px; gap: 2px; font-size: 12px; flex-wrap: nowrap; max-width: calc(100% - 8px); }
    #hud .hud-label, #hud .hud-sep { display: none; }
    #hud .hud-name { max-width: 84px; overflow: hidden; text-overflow: ellipsis; padding: 0 3px; font-size: 11px; }
    #hud button { padding: 6px 7px; min-width: 28px; }
    .sheet { padding: 12px; max-height: 92dvh; }
    .cards { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
    .modal { padding: 8px; }
  }
</style>
</head>
<body data-tab="layers">
<header>
  <h1>LOGO <b>3D</b> STUDIO</h1>
  <button id="btnImage" class="primary">＋ Importar imagem</button>
  <button id="btnText">＋ Texto 3D</button>
  <button id="btnShape">＋ Forma</button>
  <button id="btnLed">＋ LEDs</button>
  <button id="btnModels" class="primary">★ Modelos</button>
  <span style="flex:1"></span>
  <button id="btnOpen">Abrir projeto</button>
  <button id="btnSave">Salvar projeto</button>
</header>
<nav id="tabs"><button data-tab="layers" class="on">Camadas</button><button data-tab="props">Ajustes</button><button data-tab="scene">Cena e exportar</button></nav>
<aside class="left">
  <section><h3>Compor</h3>
    <div class="btns compose"><button id="cmpImage">🖼 Imagem</button><button id="cmpLight">☀️ Luz</button><button id="cmpMat">🎨 Material</button></div>
    <p class="hint">Monte o logo em camadas: a imagem, as luzes com a posição de cada uma e os materiais aplicados nas peças.</p>
  </section>
  <section><h3>Camadas</h3><div id="layers"></div></section>
  <div id="props"></div>
</aside>
<main id="stage"><canvas id="view"></canvas></main>
<aside class="right" id="scene"></aside>
<footer id="status">Pronto. Arraste um PNG com fundo transparente para a tela.</footer>
<script src="dist/app.js?v=1795123023137"></script>
<script>
  // app instalável: só funciona quando aberto por um endereço https (não pelo arquivo direto no computador)
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
